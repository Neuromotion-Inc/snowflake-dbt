edi_file_ingestion:
  # the default target (from outputs)
  target: alex_local
  outputs:
    pre_prod:
      type: snowflake
      account: 'not needed'
      user: 'not needed'
      role: EFI_DBT_ROLE
      database: SANDBOX_DB
      schema: DBT_SCHEMA_DEV
      warehouse: ETL_WH
      threads: 8
    # prod:
    #   type: snowflake
    #   account: 'not needed'
    #   user: 'not needed'
    #   role: EFI_DBT_ROLE
    #   database: tasty_bytes_dbt_db
    #   schema: prod
    #   warehouse: tasty_bytes_dbt_wh
    #   threads: 8
    # Used when running dbt on your own machine: `uv run dbt <cmd> --target local`
    # (Inside Snowflake, dbt is already authenticated, so dev/prod above need no credentials.)
    alex_local:
      type: snowflake
      account: ey50650-mightier_staging
      user: ALEX
      authenticator: snowflake_jwt
      private_key_path: "{{ env_var('HOME') }}/.snowflake/rsa_key.p8"
      role: EFI_DBT_ROLE
      database: edi_file_ingestion_db
      schema: dev
      warehouse: ETL_WH
      threads: 8
